[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blog-capstone-part-4-day-69"
version = "0.1.0"
description = "Udemy 100 Days of Code, Day 69: blog capstone part 4, adding users and authentication (README and wiki)."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
# No runtime dependencies: this repository documents the lecture only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
